---
- block:
  - name: "Deploy service -> [{{ name }}]"
    ansible.builtin.docker_container:
      name: "{{ name }}"
      image: "{{ name }}"
      recreate: true
      ports:
        - "5000:80"
      restart_policy: unless-stopped
      volumes:
        - "{{ def_path }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      healthcheck:
        test: "curl --fail http://localhost:80 || exit 1"
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

  - name: Include task -> remove docker images
    ansible.builtin.include_tasks:
      file: ./common_task/remove_untagged_images.yml

  when: 
    - inventory_hostname in groups["frontend"]
  tags: "{{ name }}"
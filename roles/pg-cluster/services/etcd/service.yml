---
- block:
  - name: "Deploy service -> [{{ name }}]"
    ansible.builtin.docker_container:
      name: "{{ name }}"
      image: "bitnami/etcd:{{ version }}"
      recreate: true
      network_mode: host
      hostname: "{{ name }}"
      env:
       #ETCD_NAME: "etcd0"
       ETCDCTL_API: "2"
       ETCD_ENABLE_V2: "true"
       ALLOW_NONE_AUTHENTICATION: "yes"
       ETCD_ADVERTISE_CLIENT_URLS: "http://192.168.0.198:2379"
       ETCD_LISTEN_CLIENT_URLS: "http://127.0.0.1:2379,http://192.168.0.198:2379"
       ETCD_LISTEN_PEER_URLS: "http://192.168.0.198:2380"
       ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://192.168.0.198:2380"
       ETCD_INITIAL_CLUSTER: "default=http://192.168.0.198:2380"
       ETCD_INITIAL_CLUSTER_TOKEN: "etcd-cluster"
       ETCD_INITIAL_CLUSTER_STATE: "new"
      # command: |
      #  -advertise-client-urls http://192.168.0.198:2379,http://192.168.0.198:4001 \ 
      #  -listen-client-urls http://0.0.0.0:2379,http://0.0.0.0:4001 \
      #  -initial-advertise-peer-urls http://192.168.0.198:2380 \
      #  -listen-peer-urls http://0.0.0.0:2380 \
      #  -initial-cluster-token etcd-cluster-1 \
      #  -initial-cluster etcd0=http://192.168.0.198:2380 \
      #  -initial-cluster-state new

  when: 
    - inventory_hostname in groups["sqlbalanser"]
  tags: "{{ name }}"


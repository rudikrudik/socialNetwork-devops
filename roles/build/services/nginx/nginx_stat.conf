
# NGINX monitoring
server {
    listen 8888;
    server_name 192.168.0.199;

    location / {
        stream_server_traffic_status_display;
        stream_server_traffic_status_display_format html;
        allow 192.168.0.199;
        allow 172.17.0.0/16;
        allow 192.168.0.0/24;
        deny all;
    }
}

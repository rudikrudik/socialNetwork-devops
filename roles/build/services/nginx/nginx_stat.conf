
# NGINX monitoring
server {
    listen 8888;
    server_name 192.168.0.199;

    location / {
        stream_server_traffic_status_display;
        stream_server_traffic_status_display_format html;
        allow 192.168.0.199;
        allow 172.17.0.0/16;
        allow 192.168.0.0/24;
        deny all;
    }

    
}

server {
    listen          8000;
    server_name     192.168.0.202;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT';
            #
            # Custom headers and headers various browsers *should* be OK with but aren't
            #
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Cookies';
            #
            # Tell client that this pre-flight info is valid for 20 days
            #
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
                }
        #if ($request_method = 'POST') {
        #    add_header 'Access-Control-Allow-Origin' $http_origin always;
        #    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        #        }
        #if ($request_method = 'GET') {
        #    #add_header 'Access-Control-Allow-Origin' $http_origin always;
        #    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        #        }

        # Proxy config
        proxy_pass http://192.168.0.202:8000;
    }
}   
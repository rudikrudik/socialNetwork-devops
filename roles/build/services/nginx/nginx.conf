worker_processes  6;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    stream_server_traffic_status_zone;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    gzip off;
    gzip_disable "msie6";


    upstream dialogs {
        server 192.168.0.212:8002;
        }

    upstream backend {
        server 192.168.0.202:8001;
        server 192.168.0.202:8002;
        server 192.168.0.202:8003;
        }

    server {
        listen 8000;
        server_name api.vsadmin.ru;

        # monitoring
        location /status {
            stream_server_traffic_status_display;
            stream_server_traffic_status_display_format html;
            allow 192.168.0.199;
            allow 172.17.0.0/16;
            allow 192.168.0.0/24;
            deny all;
            }

        # api dialogs
        location /v1/dialogs/ {
            proxy_pass http://dialogs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # api all
        location /v1/users/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://127.0.0.1:3000'; # Specify allowed origin
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookies'; # Custom headers
                add_header 'Access-Control-Allow-Credentials' 'true'; # If your application uses cookies or authentication headers
                add_header 'Access-Control-Max-Age' 1728000; # Cache preflight response for 20 days
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204; # No content for successful preflight
            }

            # Add CORS headers to all other responses
            add_header 'Access-Control-Allow-Origin' 'http://127.0.0.1:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookies' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
     }
}




        
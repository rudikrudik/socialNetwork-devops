---
- name: Build Databases
  ansible.builtin.include_tasks:
    file: db.yml
  when: 
    - inventory_hostname in groups["dbservers"]

- name: Build Backends
  ansible.builtin.include_tasks:
    file: backend.yml
  when: 
    - inventory_hostname in groups["backend"]

- name: Build Frontends
  ansible.builtin.include_tasks:
    file: frontend.yml
  when: 
    - inventory_hostname in groups["frontend"]